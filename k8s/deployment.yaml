apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-payment-app
  namespace: default
  labels:
    app: secure-payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-payment
  template:
    metadata:
      labels:
        app: secure-payment
    spec:
      containers:
        - name: payment-api
          # Replace with your exact image from GitHub Actions
          image: ghcr.io/himanshu2oo4/zero-trust-software-supply-chain-pipeline-slsa-compliant/secure-payment:12f2c8f6aaf9c4d6d981a768258ce63b83eb62df
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "84Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: secure-payment-svc
  namespace: default
spec:
  selector:
    app: secure-payment
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer 