name: DevSecops pipeline 
on: 
    push : 
        branches: 
            - main 
    pull_request : 
        branches: 
            - main 

    workflow_dispatch: 
permissions: 
  contents: read
  packages: write 
    
jobs: 
    code-security: 
        runs-on: ubuntu-latest 
        steps: 
            - name: checkout code 
              uses: actions/checkout@v4 
              with: 
                  fetch-depth: 0

            - name : gitLeak scan (secret detector)
              run: |
                echo "Downloading Gitleaks binary..."
                wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
                tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
                sudo mv gitleaks /usr/local/bin/
                
                echo "Running Gitleaks scan..."
                gitleaks detect --source="." --verbose --report-format json --report-path gitleaks-report.json --exit-code 0
            - name: checking source code logic 
              run: | 
                python3 -m pip install semgrep 
                echo "scanning using standard OWASP TOP 10 ruleset "
                semgrep scan --config=auto --json --output=semgrep-report.json || true

            - name: Upload code security scan reports 
              uses: actions/upload-artifact@v4 
              if: always()    # upload if a step have the warnings also 
              with: 
                name: code-security-scan-reports
                path: | 
                    gitleaks-report.json 
                    semgrep-report.json

            
        
    container-security: 
        name: container & dependency security 
        needs: code-security 
        runs-on: ubuntu-latest 
        steps: 
            - uses: actions/checkout@v4 
            - name: scans requirements.txt with trivy 
              uses: aquasecurity/trivy-action@master 
              with: 
                scan-type: 'fs' 
                scan-ref: '.' 
                format: 'table' 
                exit-code: '0'      # exit code  1 means break this pipeline if any vulnerbility is founded | set to 0 for testing 
                ignore-unfixed: true 
                vuln-type: 'os,library' 
                severity: 'CRITICAL,HIGH,MEDIUM'
            
            # build our hardened docker image
            - name: setup docker buildx 
              uses: docker/setup-buildx-action@v3 

            - name: Log in to GitHub Container Registry (GHCR)
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}


            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                context: ./application
                push: true
          # Converts repository name to lowercase (Docker registries require lowercase)
                tags: |
                  ghcr.io/${{ github.repository }}/secure-payment:${{ github.sha }}
                  ghcr.io/${{ github.repository }}/secure-payment:latest
      # Checkpoint 4: Image Vulnerability Scan
            - name: Scan Container Image with Trivy
              uses: aquasecurity/trivy-action@master
              with:
                format: 'table'
                exit-code: '0' # used 0 for testing  1 -> Block build if the Linux base or packages have Critical bugs
                image-ref: 'secure-payment:${{ github.sha }}'
                severity: 'CRITICAL'            
                ignore-unfixed: true # Ignore bugs that vendor hasn't released a patch for yet
 
            
            - name: Installing syft (SBOM generator)
              run: | 
                echo "Installing Anchore Syft..."
                curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

            
            - name: Generate SBOM using Syft
              run: | 
                echo "Generating SBOM for the Docker image..."
                syft secure-payment:${{ github.sha }} -o json > sbom.json

            - name: uploading SBOM artifact
              uses: actions/upload-artifact@v4 
              if: always()    # upload if a step have the warnings also 
              with: 
                name: sbom-report
                path: sbom.json
                retention-days: 30 



            - name: Cosign signing setUp 
              uses: sigstore/cosign-installer@v3.5.0

            - name: Sign Container Image with Cosign
              env:
                COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
                COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
              run: |
                  echo "Signing image with private key..."
                  # Write the private key to a temporary file
                  echo "$COSIGN_PRIVATE_KEY" > cosign.key 


                  IMAGE_TAG="ghcr.io/${{ github.repository }}/secure-payment:${{ github.sha }}"
                  cosign sign --yes --key cosign.key "$IMAGE_TAG"
                  rm -f cosign.key         # clean the private key after signing 


            - name: Verify Signature with Public Key
              run: |
                IMAGE_TAG="ghcr.io/${{ github.repository }}/secure-payment:${{ github.sha }}"
                echo "Verifying signature using cosign.pub..."
                cosign verify --key cosign.pub "$IMAGE_TAG"


          
                # Upload All Reports
            - name: Upload Security Reports & SBOM
              uses: actions/upload-artifact@v4
              if: always()
              with: 
                name: container-security-and-sbom
                path: |
                  trivy-fs-report.json
                  trivy-image-report.json
                  sbom.cyclonedx.json
                retention-days: 14