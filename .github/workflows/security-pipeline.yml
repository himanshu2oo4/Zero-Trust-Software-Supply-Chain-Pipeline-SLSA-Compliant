name: DevSecops pipeline 
on: 
    push : 
        branches: 
            - main 
    pull_request : 
        branches: 
            - main 

    workflow_dispatch: 

    
jobs: 
    code-security: 
        runs-on: ubuntu-latest 
        steps: 
            - name: checkout code 
              uses: actions/checkout@v4 
              with: 
                  fetch-depth: 0

            - name : gitLeak scan (secret detector)
              run: | 
                python3 -m pip install gitleaks 
                echo "scanning for secrets in source code using gitleaks "
                gitleaks detect --source . --report=gitleaks-report.json --report-format=json --redact

            - name: checking source code logic 
              run: | 
                python3 -m pip install semgrep 
                echo "scanning using standard OWASP TOP 10 ruleset "
                semgrep scan --config=auto --json --output=semgrep-report.json || true

            - name: Upload code security scan reports 
              uses: actions/upload-artifact@v4  
              if: always()    # upload if a step have the warnings also 
              with: 
                name: code-security-scan-reports
                path: | 
                    gitleaks-report.json 
                    semgrep-report.json

            
        
    container-security: 
        name: container & dependency security 
        needs: code-security 
        runs-on: ubuntu-latest 
        steps: 
            - uses: actions/checkout@v4 
            - name: scans requirements.txt with trivy 
              uses: aquasecurity/trivy-action@master 
              with: 
                scan-type: 'fs' 
                scan-ref: '.' 
                format: 'table' 
                exit-code: '0'      # exit code  1 means break this pipeline if any vulnerbility is founded | set to 0 for testing 
                ignore-unfixed: true 
                vuln-type: 'os,library' 
                severity: 'CRITICAL,HIGH,MEDIUM'
            
            # build our hardened docker image
            - name: setup docker buildx 
              uses: docker/setup-buildx-action@v3 

            - name: Build docker image locally 
              working-directory: ./application
              run: | 
                docker build -t secure-payment:${{ github.sha }} . 

      # Checkpoint 4: Image Vulnerability Scan
            - name: Scan Container Image with Trivy
              uses: aquasecurity/trivy-action@master
              with:
                format: 'table'
                exit-code: '0' # used 0 for testing  1 -> Block build if the Linux base or packages have Critical bugs
                image-ref: 'secure-payment-api:${{ github.sha }}'
                severity: 'CRITICAL'            
                ignore-unfixed: true # Ignore bugs that vendor hasn't released a patch for yet
 
    